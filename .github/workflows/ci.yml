name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Also run as the first stage of a release (release.yml).
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: System libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Web build compiles
        run: cargo check -p ship2d_graphics --lib --target wasm32-unknown-unknown

      # Includes the stored-solution tests (every solution still solves every case and
      # matches its index entry) and a real compile of a solution source by the viewer.
      - name: Test
        run: cargo test --workspace --release

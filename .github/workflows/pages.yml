name: GitHub Pages

# Builds the viewer for the web with trunk and deploys it on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # No Rust cache: it would add another one of over 1 GB, and push CI's caches for main out
      # of the repository's 10 GB limit. Deploys aren't waited on like CI, so they build cold.

      - name: Install trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf- -C "$HOME/.cargo/bin"
          trunk --version

      # The site is served from https://<owner>.github.io/<repository>/, so all URLs need
      # that prefix.
      - name: Build
        working-directory: viewer
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

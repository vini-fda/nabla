name: Release

# Publishes a GitHub Release with native builds of the viewer for every version tag `vX.Y.Z`.
# Pushes to main never release. To release, bump the versions and push a tag (see README.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the Cargo versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          for manifest in Cargo.toml viewer/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$manifest::version is $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # The oldest supported Ubuntu, so the binary needs the oldest glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NAME: ship2d-viewer-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: System libraries for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev

      # The Liquid Glass icon needs Xcode 26; bundle.sh falls back to a flat icon otherwise.
      - name: Select the newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build and package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          viewer/macos/bundle.sh
          mkdir -p dist
          ditto -c -k --keepParent "target/release/Nabla.app" "dist/$NAME.zip"

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p ship2d_graphics --target ${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/ship2d_graphics" viewer/README.md \
            viewer/LICENSE-MIT viewer/LICENSE-APACHE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -r "dist/$NAME"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release -p ship2d_graphics --target ${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/ship2d_graphics.exe" viewer/README.md \
            viewer/LICENSE-MIT viewer/LICENSE-APACHE "dist/$NAME/"
          (cd dist && 7z a -tzip "$NAME.zip" "$NAME" >/dev/null)
          rm -r "dist/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{TAG}}/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag

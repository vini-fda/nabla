name: Release

# Publishes a GitHub Release with native builds of the viewer for every version tag `vX.Y.Z`.
# Pushes to main never release. To release, bump the versions and push a tag (see README.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the Cargo versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          for manifest in Cargo.toml viewer/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$manifest::version is $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # The oldest supported Ubuntu, so the binary needs the oldest glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NAME: ship2d-viewer-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # A tag's caches could only ever be restored by runs on that same tag: don't save them.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false

      - name: System libraries for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libasound2-dev

      # The Liquid Glass icon needs Xcode 26; `cargo xtask bundle` falls back to a flat icon
      # otherwise.
      - name: Select the newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Developer ID signing and notarization, when the repository has the secrets (see
      # README.md). Without them, the app is signed ad-hoc and Gatekeeper blocks its first launch.
      - name: Is Developer ID signing set up?
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "SIGN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No MACOS_CERTIFICATE secret: the macOS app is signed ad-hoc and not notarized"
          fi

      # Compile before the certificate is in a keychain, so no build script runs while it is.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p ship2d_graphics --target ${{ matrix.target }}
          cargo build -p xtask

      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.SIGN == '1'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo xtask bundle --target ${{ matrix.target }} ${SIGN_IDENTITY:+--sign "$SIGN_IDENTITY"}

      - name: Notarize and staple
        if: runner.os == 'macOS' && env.SIGN == '1'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          app="target/${{ matrix.target }}/release/Nabla.app"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}"
            echo "::error::Notarization failed"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type exec -vv "$app"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/Nabla.app" "dist/$NAME.zip"

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p ship2d_graphics --target ${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/ship2d_graphics" viewer/README.md \
            viewer/LICENSE-MIT viewer/LICENSE-APACHE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -r "dist/$NAME"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release -p ship2d_graphics --target ${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/ship2d_graphics.exe" viewer/README.md \
            viewer/LICENSE-MIT viewer/LICENSE-APACHE "dist/$NAME/"
          (cd dist && 7z a -tzip "$NAME.zip" "$NAME" >/dev/null)
          rm -r "dist/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The notes keep the macOS line marked `<!-- notarized -->` or `<!-- unsigned -->`, as the
      # build job signed it: it notarizes whenever MACOS_CERTIFICATE is set, or fails.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then keep=notarized drop=unsigned; else keep=unsigned drop=notarized; fi
          sed -e "s/{{TAG}}/$GITHUB_REF_NAME/g" -e "/<!-- $drop -->/d" -e "s/ <!-- $keep -->\$//" \
            .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag

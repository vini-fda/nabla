# https://github.com/crate-ci/typos
# install:  cargo install typos-cli
# run:      typos

[default.extend-words]
egui = "egui"  # Example for how to ignore a false positive
thm = "thm"  # The label prefix of the theorems in docs/multiplayer.typ, and of their checks
Pease = "Pease"  # Marshall Pease, an author in the references of docs/multiplayer.typ

[files]
# Generated by crates/nabla-client/formulas: path data and hashed glyph ids, no words.
extend-exclude = ["crates/nabla-client/assets/formulas/*.svg"]

# https://github.com/crate-ci/typos
# install:  cargo install typos-cli
# run:      typos

[default.extend-words]
egui = "egui" # Example for how to ignore a false positive

[files]
# Generated by crates/nabla/formulas: path data and hashed glyph ids, no words.
extend-exclude = ["crates/nabla/assets/formulas/*.svg"]

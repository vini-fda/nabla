[package]
name = "nabla-client"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
description = "Nabla: fly the 2D ship to its goal, by hand or with a control policy as autopilot, natively and on the web."
license = "MIT OR Apache-2.0"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml", "assets/controller_icons/**/*", "assets/fonts/*", "assets/formulas/*", "src/*.wgsl"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# `main.rs` has no tests: without `test = false`, `cargo test --release` builds it as a test binary,
# with the release profile's slow whole-program LTO. Nor does it have docs of its own: named apart
# from the library, it would otherwise get its own page from `cargo doc`.
[[bin]]
doc = false
name = "nabla"
path = "src/main.rs"
test = false

[dependencies]
# Without the default `system_fonts` (system font fallback for glyphs the bundled fonts lack),
# `links` (opening URLs; the app opens none) and `accesskit` (screen readers; on Linux it pulls
# in zbus and an async runtime). About 60 fewer crates on Linux, 40 on macOS and Windows.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "clipboard", "wayland", "web_screen_reader", "wgpu", "x11"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
egui_plot = { version = "0.38.0" }
# Game controllers, which egui doesn't read: natively from the system's HID devices, on the web
# through the browser's Gamepad API (src/gamepad.rs).
gilrs = "0.11.2"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
nabla-core.workspace = true
nabla-net.workspace = true
nabla-sim.workspace = true
nabla-synth.workspace = true
rfd = "0.17.2"
# `std::time::Instant` on the web too, where the standard one panics (src/span.rs).
web-time = "1.1.0"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Audio output. On the web, an AudioWorklet plays the sounds instead (src/sound/web.rs).
cpal = "0.18.2"
# Without the default `humantime` (timestamps) and `regex` (regex filters in `RUST_LOG`)
# features, which pull in `jiff` and `regex`: about 13 s of compile time.
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
# The connection to a server, on a thread of its own with a `tokio` runtime (src/net.rs). On the
# web, `web_sys::WebTransport` is the connection.
nabla-net = { workspace = true, features = ["native"] }

# The real server, for the flight to be tested against (tests/online_loopback.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
nabla-server.workspace = true
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"

# The DOM (to hide the loading text), Web Audio with its AudioWorklet (src/sound/web.rs), the
# Gamepad API, for the touchpad gilrs doesn't read (src/gamepad.rs), and WebTransport, to fly
# on a server (src/net.rs), which web-sys gates behind `--cfg=web_sys_unstable_apis`.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.107"
features = [
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "BaseAudioContext",
  "Gamepad",
  "GamepadButton",
  "Location",
  "MessagePort",
  "Navigator",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Response",
  "WebTransport",
  "WebTransportBidirectionalStream",
  "WebTransportDatagramDuplexStream",
  "WebTransportHash",
  "WebTransportOptions",
  "Window",
  "Worklet",
  "WritableStream",
  "WritableStreamDefaultWriter",
]

# eframe's default features also turn on winit's (Wayland client-side window decorations, and
# loading the Wayland libraries at runtime). Without them, this keeps them: same version, so
# Cargo unifies it with eframe's winit.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"

[lints]
workspace = true

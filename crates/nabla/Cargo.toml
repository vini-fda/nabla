[package]
name = "nabla"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
description = "Nabla: replays, plots and compiles control policies of the 2D ship, natively and on the web."
license = "MIT OR Apache-2.0"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml", "assets/fonts/*", "assets/formulas/*"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# `main.rs` has no tests: without this, `cargo test --release` builds it as a test binary, with the
# release profile's slow whole-program LTO.
[[bin]]
name = "nabla"
path = "src/main.rs"
test = false

[dependencies]
# Without the default `system_fonts` (system font fallback for glyphs the bundled fonts lack),
# `links` (opening URLs; the app opens none) and `accesskit` (screen readers; on Linux it pulls
# in zbus and an async runtime). About 60 fewer crates on Linux, 40 on macOS and Windows.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "clipboard", "wayland", "web_screen_reader", "wgpu", "x11"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
egui_plot = { git = "https://github.com/emilk/egui_plot", rev = "aead78045a529884eac5ad267251caa73bd832aa" }
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
nabla-core.workspace = true
nabla-optimization.workspace = true
nabla-solutions = { workspace = true, features = ["registry"] }
nabla-synth.workspace = true

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Audio output. On the web, an AudioWorklet plays the sounds instead (src/sound/web.rs).
cpal = "0.18.2"
# Without the default `humantime` (timestamps) and `regex` (regex filters in `RUST_LOG`)
# features, which pull in `jiff` and `regex`: about 13 s of compile time.
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
rfd = "0.17.2"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

# The DOM (to hide the loading text), and Web Audio with its AudioWorklet (src/sound/web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.106"
features = [
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioWorklet",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "BaseAudioContext",
  "MessagePort",
  "Response",
  "Window",
  "Worklet",
]

# eframe's default features also turn on winit's (Wayland client-side window decorations, and
# loading the Wayland libraries at runtime). Without them, this keeps them: same version, so
# Cargo unifies it with eframe's winit.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"

[lints]
workspace = true

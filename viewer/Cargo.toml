[package]
name = "ship2d_graphics"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml", "assets/fonts/*"]
rust-version = "1.99"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.36.2"
egui_plot = "0.37.0"
eframe = { version = "0.36.2", features = ["glow"] }
log = "0.4.34"
ship2d_optimization = { path = "..", features = ["registry"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
rfd = "0.17.2"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"             # to access the DOM (to hide the loading text)

[lints]
workspace = true
